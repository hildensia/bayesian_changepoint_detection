name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test requirements
        # numpy/scipy are listed explicitly: the test suite uses them even
        # though the library itself only needs torch.
        run: pip install -e . pytest pytest-cov numpy scipy

      - name: Run tests
        # Coverage is measured on every version; the run fails if it drops
        # below the floor. Raise the floor when coverage rises, never lower it
        # to make a PR pass.
        run: >-
          pytest tests/ -q
          --cov=bayesian_changepoint_detection
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=94

      - name: Publish the coverage table in the job summary
        if: always() && matrix.python-version == '3.12'
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }}, CPU)" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  examples:
    # Run every example script headless, from a scratch directory, with the
    # plot extra installed. Catches examples that drift from the API.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch (CPU), the package and the plot extra
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[plot]"
      - name: Run the examples
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p /tmp/examples-out && cd /tmp/examples-out
          for script in simple_example basic_usage multivariate_example gpu_acceleration benchmark_offline; do
            echo "::group::$script"
            python "$GITHUB_WORKSPACE/examples/$script.py"
            echo "::endgroup::"
          done
          ls -l /tmp/examples-out

  docs:
    # Build the documentation site with --strict, so a broken link, a missing
    # README snippet section or a docstring mkdocstrings cannot parse fails
    # the PR. The site is not deployed yet (GitHub Pages needs the repository
    # owner to enable it); the built HTML is uploaded as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch (CPU), the package and the docs extra
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/

  build:
    # Build the sdist and wheel, check their metadata, then install the wheel
    # into a clean environment (no repository checkout on sys.path) and run
    # the two detectors once. This is what a `pip install bayesian-changepoint`
    # user gets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          from functools import partial
          import torch
          import bayesian_changepoint_detection as bcd
          from bayesian_changepoint_detection import (
              offline_changepoint_detection, online_changepoint_detection,
              get_map_changepoints, constant_hazard, const_prior, StudentT,
          )
          from bayesian_changepoint_detection.offline_likelihoods import StudentT as OfflineStudentT

          print("bayesian-changepoint", bcd.__version__)
          torch.manual_seed(0)
          data = torch.cat([torch.randn(40), torch.randn(40) + 5])
          R, _ = online_changepoint_detection(
              data, partial(constant_hazard, 50, device="cpu"),
              StudentT(0.1, 0.01, 1.0, 0.0, device="cpu"), device="cpu",
          )
          online = get_map_changepoints(R, min_separation=5).tolist()
          Q, P, Pcp = offline_changepoint_detection(
              data, partial(const_prior, p=1 / (len(data) + 1)),
              OfflineStudentT(device="cpu"), device="cpu",
          )
          offline = int(torch.argmax(torch.exp(Pcp).sum(0))) + 1
          print("online", online, "offline", offline)
          assert len(online) == 1 and abs(online[0] - 40) <= 1, online
          assert abs(offline - 40) <= 1, offline
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
