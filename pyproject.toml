[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name, new in 1.1.0. This project was previously published
# as "bayescd" (0.4, 2022) and, before that, as "bayesian-changepoint-detection"
# (0.2.dev1); both are Johannes Kulick's and neither is updated any more. The
# import name is unchanged: `import bayesian_changepoint_detection`.
name = "bayesian-changepoint"
version = "1.1.0"
description = "Bayesian changepoint detection algorithms with PyTorch support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Johannes Kulick", email = "mail@johanneskulick.net"}
]
maintainers = [
    {name = "Johannes Kulick", email = "mail@johanneskulick.net"},
    {name = "Esteban Carisimo", email = "el.murdo@gmail.com"},
]
keywords = ["bayesian", "changepoint", "detection", "time-series", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
# The library itself imports only torch. numpy/scipy are used by the test
# suite, matplotlib/seaborn only by the examples and notebooks.
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
]
plot = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
# The documentation site (mkdocs.yml). MkDocs 2.0 drops the plugin system
# that Material and mkdocstrings rely on, so stay on 1.x.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
gpu = [
    "torch[cuda]>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/hildensia/bayesian_changepoint_detection"
Repository = "https://github.com/hildensia/bayesian_changepoint_detection"
Issues = "https://github.com/hildensia/bayesian_changepoint_detection/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bayesian_changepoint_detection*"]

[tool.ruff]
line-length = 88
target-version = "py39"
# Python sources only: no notebooks, and no fenced code blocks in Markdown
# (ruff formats those by default since 0.16).
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is left to the formatter; long lines that survive it are in
# docstrings and comments.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Regression tests import after an importorskip / path setup on purpose.
"tests/test_regression_vs_numpy.py" = ["E402"]
"tests/test_studentt_exactness.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bayesian_changepoint_detection"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is opt-in (pytest --cov=bayesian_changepoint_detection) so that a
# plain `pytest` run does not require pytest-cov to be installed.
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    # Every test carries exactly one of the next two (tests/conftest.py enforces it).
    "math: checks a value against an independent computation of it: scipy, an exhaustive enumeration, a closed form from a paper, a derivation sharing no code with the one under test",
    "behavior: pins current behavior: API contracts, edge cases, device handling, two code paths of one formula, detection on synthetic data, goldens from an earlier version",
]

[tool.coverage.run]
source = ["bayesian_changepoint_detection"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
